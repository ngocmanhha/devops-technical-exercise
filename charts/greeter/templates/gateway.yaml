{{- if .Values.gateway.enabled }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: {{ include "greeter.fullname" . }}

spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRefs.name }}
      namespace: {{ .Values.gateway.parentRefs.namespace | default "envoy-gateway-system" }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: {{ include "greeter.fullname" . }}
          port: {{ .Values.service.port }}

{{- end }}
