replicaCount: 2

image:
  repository: greeter
  tag: exercise
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

application:
  greetingName: "what3words"
  version: "exercise"
  port: 8080

  warmupSeconds: 30
  shutdownDelaySeconds: 10
  drainTimeoutSeconds: 20

service:
  type: ClusterIP
  port: 80

gateway:
  enabled: true

  annotations: {}
  hostnames: []
  parentRefs:
    name: what3words-gateway

monitoring:
  enabled: false

  serviceMonitor:
    enabled: false
    port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 5s

  prometheusRule:
    enabled: false
    rules:
      - alertName: GreeterHigh5xxErrorRate
        expr: |
          sum(rate(greeter_http_requests_total{status=~"5.."}[1m]))
          /
          sum(rate(greeter_http_requests_total[1m]))
          > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Greeter has a high HTTP 5xx error rate
          description: More than 10% of Greeter requests have returned HTTP 5xx responses for 2 minutes.

resources:
  requests:
    cpu: 50m
    memory: 32Mi

  limits:
    cpu: 250m
    memory: 128Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

terminationGracePeriodSeconds: 40

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
